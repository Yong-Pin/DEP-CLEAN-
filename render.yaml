services:
  - type: web
    name: dep-nesso-safety
    runtime: python
    region: singapore
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: INGEST_API_KEY
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: PUBLIC_DASHBOARD_URL
        value: https://dep-nesso-safety.onrender.com
